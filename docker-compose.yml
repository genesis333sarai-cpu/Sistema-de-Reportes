
services:
  sistema-reportes:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sistema-reportes

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      VINTO_DB: "sqlite:////app/vinto.db"
      VINTO_UPLOADS: "/app/uploads"
      VINTO_SECRET: "${VINTO_SECRET:-cambia-esta-clave-en-produccion}"

    volumes:
      # Mantener la base de datos en Windows
      - ./vinto.db:/app/vinto.db

      # Mantener las evidencias en Windows
      - ./uploads:/app/uploads

      # Volumen nombrado de Docker
      - vinto_data:/app/data

    restart: "no"

volumes:
  vinto_data:
    name: proyecto_segunda_fase_sistema_de_reportes_vinto_data
